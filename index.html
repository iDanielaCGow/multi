<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>

    <a-scene
      mindar-image="imageTargetSrc: ./markerc.mind; maxTrack: 4"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>

        <a-asset-item
          id="LinkModel"
          src="./Link.glb">
        </a-asset-item>

        <a-asset-item
          id="ZoraModel"
          src="./Zora.glb">
        </a-asset-item>

        <a-asset-item
          id="GoronModel"
          src="./Goron.glb">
        </a-asset-item>

        <a-asset-item
          id="DekuModel"
          src="./Deku.glb">
        </a-asset-item>

      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>


      <a-entity mindar-image-target="targetIndex: 0">

        <a-gltf-model
          src="#LinkModel"
          position="0 0 0.1"
          rotation="0 0 0"
          scale="0.020715 0.020715 0.020715"
          animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
        </a-gltf-model>

      </a-entity>


      <a-entity mindar-image-target="targetIndex: 1">

        <a-gltf-model
          src="#ZoraModel"
          position="0 0 0.1"
          rotation="0 0 0"
          scale="0.020715 0.020715 0.020715"
          animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
        </a-gltf-model>

      </a-entity>


      <a-entity mindar-image-target="targetIndex: 2">

        <a-gltf-model
          src="#GoronModel"
          position="0 0 0.1"
          rotation="0 0 0"
          scale="0.020715 0.020715 0.020715"
          animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
        </a-gltf-model>

      </a-entity>


      <a-entity mindar-image-target="targetIndex: 3">

        <a-gltf-model
          src="#DekuModel"
          position="0 0 0.1"
          rotation="0 0 0"
          scale="0.020715 0.020715 0.020715"
          animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
        </a-gltf-model>

      </a-entity>

    </a-scene>

  </body>
</html>
